name: Bug report
description: Something doesn't work as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Within a few minutes, the issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/repo-pager/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **Never post** tokens, keys, passwords or other personal data. Report a vulnerability privately, as described in [SECURITY.md](https://github.com/Dennis-Otto/repo-pager/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of the pager that misbehaves.
      options:
        - Worker and its rules
        - Telegram and its topics
        - Buttons
        - Control repository
        - Set-up and deployment
        - Website
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release of Repo Pager that your copy runs, as /status names it.
      placeholder: "0.9.1"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The steps that make the problem happen again, as far as you know them.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The relevant lines of the log, without secrets: those of the Worker from
        `npx wrangler tail` or under Workers, your Worker, Logs on the dashboard of
        Cloudflare, and the run of the workflow of your control repository when a
        job of it is involved.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed tokens, keys and personal data from everything I posted.
          required: true
