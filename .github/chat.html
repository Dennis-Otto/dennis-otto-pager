<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Pager: the chat</title>
<!-- scripts/screenshots.sh photographs each chat of this page, by its id such as
     chat-alarm-en, as docs/images/screenshots/<id>.png in Telegram's light theme and
     <id>.dark.png in its dark one. What the chats say comes from chat.js, which
     test/chat.test.ts writes from render() of src/render.ts, keyboard() of
     src/buttons.ts and topicName() of src/topics.ts, so a changed word of the pager
     changes the pictures. This page only draws them, with nothing from the network. -->
<style>
/* The emoji of the pager in color, as Telegram shows them, and every other character in a sans-serif font. */
@font-face { font-family: "Emoji"; src: local("Noto Color Emoji"), local("NotoColorEmoji"), local("Segoe UI Emoji");
  unicode-range: U+200D, U+2190-21FF, U+2300-23FF, U+2600-27BF, U+2B00-2BFF, U+FE0F, U+1F000-1FAFF; }
:root {
  color-scheme: light dark;
  --wallpaper: linear-gradient(160deg, #d3e3c4 0%, #b4d0b8 55%, #9fc3b9 100%);
  --bar: #ffffff;
  --bar-line: rgba(0, 0, 0, 0.08);
  --title: #000000;
  --muted: #8a9aa9;
  --bubble: #ffffff;
  --text: #000000;
  --link: #168acd;
  --quote: rgba(22, 138, 205, 0.08);
  --quote-line: #168acd;
  --meta: #a0acb6;
  --button: rgba(46, 76, 66, 0.32);
  --button-text: #ffffff;
  --service: rgba(46, 76, 66, 0.38);
  --list: #ffffff;
  --row-line: rgba(0, 0, 0, 0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --wallpaper: radial-gradient(420px 300px at 85% 15%, rgba(106, 179, 243, 0.06), transparent 70%), #0e1621;
    --bar: #17212b;
    --bar-line: rgba(0, 0, 0, 0.35);
    --title: #f5f5f5;
    --muted: #6d7f8f;
    --bubble: #182533;
    --text: #f5f5f5;
    --link: #6ab3f3;
    --quote: rgba(106, 179, 243, 0.1);
    --quote-line: #6ab3f3;
    --meta: #6d7f8f;
    --button: #1f3043;
    --button-text: #f5f5f5;
    --service: rgba(31, 48, 67, 0.9);
    --list: #17212b;
    --row-line: rgba(255, 255, 255, 0.06);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* No background around the chats: the corners of a picture stay transparent. */
html, body { background: transparent; }
body {
  display: flex; flex-direction: column; align-items: flex-start; gap: 32px; padding: 24px;
  font-family: "Emoji", "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.chat { width: 480px; border-radius: 18px; overflow: hidden; background: var(--wallpaper); color: var(--text); }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--bar-line); }
.back { font-size: 30px; line-height: 1; color: var(--muted); margin-top: -4px; }
.avatar { width: 40px; height: 40px; flex: none; }
.avatar svg { width: 100%; height: 100%; display: block; }
.head { min-width: 0; }
.name { font-size: 16px; font-weight: 600; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 13px; color: var(--muted); margin-top: 1px; }
.messages { display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 18px; }
.message { width: 100%; }
.bubble { position: relative; background: var(--bubble); border-radius: 14px 14px 14px 4px; padding: 7px 11px 7px;
  font-size: 15px; line-height: 1.38; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text b { font-weight: 700; }
.text a { color: var(--link); text-decoration: none; }
.text blockquote { display: block; margin: 4px 0; padding: 4px 8px 4px 10px; border-left: 3px solid var(--quote-line);
  border-radius: 4px; background: var(--quote); }
/* Room for the time on the last line, as Telegram leaves it. */
.text::after { content: ""; display: inline-block; width: var(--room); }
.meta { position: absolute; right: 10px; bottom: 5px; font-size: 12px; color: var(--meta); }
.keyboard { display: grid; gap: 4px; margin-top: 4px; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.row span { display: flex; align-items: center; justify-content: center; height: 38px; padding: 0 6px; border-radius: 8px;
  background: var(--button); font-size: 14px; font-weight: 600; color: var(--button-text); white-space: nowrap; }
.service { align-self: center; max-width: 90%; padding: 4px 11px; border-radius: 13px; background: var(--service);
  font-size: 13px; font-weight: 600; color: #ffffff; text-align: center; }
.topics { list-style: none; background: var(--list); }
.topics li { display: grid; grid-template-columns: 38px 1fr auto; column-gap: 12px; align-items: center; padding: 10px 16px; }
.topics li + li { border-top: 1px solid var(--row-line); }
.icon { grid-row: span 2; width: 38px; height: 38px; }
.icon svg { width: 100%; height: 100%; display: block; }
.topic { font-size: 15px; font-weight: 600; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { font-size: 12px; color: var(--muted); }
.last { grid-column: 2 / 4; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<script src="chat.js"></script>
<script>
"use strict";
// The logo of the pager: a bell on its orange circle.
const AVATAR = `<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs>
  <circle cx="48" cy="48" r="48" fill="url(#logo)"/>
  <path d="M48 20a3.4 3.4 0 0 1 3.4 3.4v1.8c7.2 1.6 11.8 7.9 11.8 15.3v8.8l4.5 6.1a1.8 1.8 0 0 1-1.5 2.9H29.8a1.8 1.8 0 0 1-1.5-2.9l4.5-6.1v-8.8c0-7.4 4.6-13.7 11.8-15.3v-1.8A3.4 3.4 0 0 1 48 20z" fill="#fff"/>
  <path d="M41.8 62h12.4a6.2 6.2 0 0 1-12.4 0z" fill="#fff"/>
</svg>`;

/** The icon of a topic, as Telegram draws it: a speech bubble in the color that the pager chose. */
function icon(color) {
  return `<svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M19 4C10.2 4 3 10.3 3 18c0 4.2 2.1 8 5.5 10.6L7 34l6.4-3.1c1.8.5 3.6.8 5.6.8 8.8 0 16-6.3 16-14S27.8 4 19 4z" fill="${color}"/>
  </svg>`;
}

/** An element with its class and its HTML. */
function element(tag, className, html) {
  const node = document.createElement(tag);
  node.className = className;
  node.innerHTML = html;
  return node;
}

/** A text of the data as HTML: escaped, since only the texts of messages are HTML of Telegram. */
function plain(text) {
  const node = document.createElement("span");
  node.textContent = text;
  return node.innerHTML;
}

/** The last line of a message of the pager as plain text, as the list of topics shows it. */
function lastLine(html) {
  const node = document.createElement("div");
  node.innerHTML = html;
  const lines = node.textContent.split("\n").filter((line) => line.trim() !== "");
  return lines.at(-1) ?? "";
}

/** A message of the pager: its text, its time and its buttons. */
function message(data) {
  const node = element("div", "message", "");
  const time = data.time;
  const bubble = element("div", "bubble", "");
  // A quote of Telegram is a block of its own: the line break around it is no empty line.
  bubble.append(element("div", "text", data.text.replace(/\n?(<blockquote[^>]*>[\s\S]*?<\/blockquote>)\n?/g, "$1")));
  bubble.append(element("span", "meta", plain(time)));
  bubble.style.setProperty("--room", `${time.length * 7 + 8}px`);
  node.append(bubble);
  if (data.buttons.length > 0) {
    const keyboard = element("div", "keyboard", "");
    for (const row of data.buttons) {
      keyboard.append(element("div", "row", row.map((label) => `<span>${plain(label)}</span>`).join("")));
    }
    node.append(keyboard);
  }
  return node;
}

/** One chat: the bar with its title, and its messages or its list of topics. */
function chat(id, language, scene) {
  const node = element("section", "chat", "");
  node.id = id;
  node.lang = language;
  node.append(element("div", "bar", `<span class="back">‹</span><div class="avatar">${AVATAR}</div>
    <div class="head"><div class="name">${plain(scene.title)}</div><div class="status">${plain(scene.subtitle)}</div></div>`));
  if (scene.topics) {
    const list = element("ul", "topics", "");
    for (const topic of scene.topics) {
      list.append(element("li", "", `<span class="icon">${icon(topic.color)}</span>
        <span class="topic">${plain(topic.name)}</span><span class="when">${plain(topic.time)}</span>
        <span class="last">${plain(lastLine(topic.text))}</span>`));
    }
    node.append(list);
  } else {
    const messages = element("div", "messages", "");
    for (const data of scene.messages) {
      messages.append(data.service === undefined ? message(data) : element("div", "service", plain(data.service)));
    }
    node.append(messages);
  }
  return node;
}

for (const [language, scenes] of Object.entries(window.CHAT)) {
  for (const [name, scene] of Object.entries(scenes)) {
    document.body.append(chat(`chat-${name}-${language}`, language, scene));
  }
}
</script>
</body>
</html>
