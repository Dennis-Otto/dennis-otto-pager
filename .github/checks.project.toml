# The explanations of the checks of this project alone, on top of .github/checks.toml,
# which the blueprint keeps current. When one of them fails, the PR coach shows its
# explanation in the summary of the check, as its annotation and in its comment on the
# pull request, also on a pull request from a fork; scripts/check.sh shows those of its
# steps on your machine too. Explain every check that you add to the required checks
# of .github/repository.project.toml, so that the next person sees how to fix it. The
# comment follows a workflow of this project alone, such as one of visual tests, once
# the answer test_workflows of .copier-answers.yml names it.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/checks.md#the-pr-coach

# A check by the name that GitHub shows, where a * stands for any text. Each has a
# title, problem, why and fix, and may have commands, one per line, and docs, a link or
# a file of the repository with its anchor. Each says in autofix how it fixes itself:
# the commands that fix what it finds, or the reason why no command can. The fix bot
# commits the fixes of every workflow of the list of after-checks.yml, also of one of
# the project's own that the answer test_workflows names: with the steps "Fix what a
# command can fix" and "Keep the fixes for the fix bot" of ci.yml at the end of the job
# of its check, an artifact fixes-<name> of its own, which in a matrix job also holds
# strategy.job-index, since each leg needs its own, and fetch-depth: 2 in its checkout.
# A check that only a person can fix says why:
# [check."e2e (*)"]
# title = "The end-to-end tests"
# problem = """A test of the whole app in a real browser failed; the summary of the
# check names the test, and its trace shows each step."""
# why = """These tests use the app as its users do, in a real browser."""
# fix = """Run the test that failed on your machine, fix what it shows, and push."""
# commands = ["bash tests/e2e/run.sh"]
# docs = "CONTRIBUTING.md#checks"
# autofix = """A test in a browser that fails needs a person, who knows what the app
# should do."""

# A step of scripts/check.sh by the name that it prints, such as the step that runs
# scripts/check-project.sh, to explain the checks of this project there:
# [step."Checks of this project"]
# problem = """..."""
# why = """..."""
# fix = """..."""
# autofix = ["npm run lint -- --fix"]

# A part that a workflow of this project adds to the report of the PR coach, such as
# the size of a module or the result of visual tests, in place of a comment of its own.
# The workflow keeps the artifact pr-report-<name>, here pr-report-card-size, for the
# head of the pull request, with the file report.md in it: Markdown whose text the
# coach shows only as code, a table with code in each cell, and a first line
# <!-- quiet --> when the part is no news by itself. The coach shows it after its own
# parts, under the title and the text of about from here, and deletes the old comment
# of the token of the workflows whose body begins with the marker of replaces. Name the
# workflow in test_workflows of .copier-answers.yml, so that the coach runs after it:
# [report.card-size]
# title = "The size of the card"
# about = """The size of `dist/card.js` against that of main."""
# replaces = "<!-- card-size -->"

[step."Checks of this project"]
problem = """A test of the Worker passes with the values of `wrangler.jsonc` but fails with
those of another instance, which `scripts/check-project.sh` sets by
`scripts/another-instance.config.ts`, or `scripts/register-app.mjs` fails its test,
`test/register-app-script.mjs`: the output above names the test."""
why = """`wrangler.jsonc` holds the values of one instance, and every copy sets its own
there, as `docs/setup.md` asks. A test that holds on to one maintainer, control
repository or language fails the checks of every other copy, which then can't merge a
change of its own or take an update. `scripts/register-app.mjs` stores the private key
and the webhook secret of the GitHub App, which GitHub hands out only once: a change of
it, of Node or of Wrangler that breaks it costs the next person their new app."""
fix = """Take the value from `env` of `cloudflare:test` in the test, as `test/index.test.ts`
does, or set it in the environment that the test passes; for the script, run its test
alone with `node --test test/register-app-script.mjs` and fix what it names. Then run
the checks again:"""
commands = ["bash scripts/check-project.sh"]
docs = ".github/agents.project.md"
autofix = """A test that holds on to the values of one instance, or a script that fails
its test, needs a person, who decides which value or behavior it means."""
