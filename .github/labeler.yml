# The area labels of pull requests by the files they change, for the Area labels
# workflow; each label is an area of .github/labels.toml, with an option of the
# Area field of the issue forms. The code of the Worker that no other area names
# is its rules. A file of the blueprint has no area: the title check labels the
# pull requests of the bots.
"area: rules":
  - changed-files:
      - any-glob-to-any-file:
          - "src/{advisories,content,context,crypto,deadlines,deliveries,github,health,index,pager,pictures,render,routes,rules,schedule,serial,settings,store,texts,tokens,translations,usage,version,workflows,zip}.ts"
          - "test/{apis,basics,content,deadlines,deliveries,health,index,pager,pictures,rules,security,texts,tokens,translations,usage,version,workflows,zip}.test.ts"
          - test/helpers.ts
          - test/zips.ts
          - test/stand-ins/**
"area: telegram":
  - changed-files:
      - any-glob-to-any-file:
          - "src/{telegram,topics,updates,open,status}.ts"
          - "test/{topics,updates,open,status}.test.ts"
"area: buttons":
  - changed-files:
      - any-glob-to-any-file:
          - src/buttons.ts
          - src/actions.ts
"area: control":
  - changed-files:
      - any-glob-to-any-file:
          - src/control.ts
          - test/control.test.ts
"area: setup":
  - changed-files:
      - any-glob-to-any-file:
          - wrangler.jsonc
          - github-app.json
          - "scripts/{register-app.mjs,app-address.ts,deploy-worker.sh,another-instance.config.ts}"
          - "test/{register-app.test.ts,register-app-script.mjs,manifest.test.ts}"
          - "docs/{setup,releases}*.md"
"area: website":
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - mkdocs.yml
          - README.md
          - README.de.md
          - .github/chat.*
          - .github/social-preview.html
          - "test/{chat,social-preview,brand}.test.ts"
